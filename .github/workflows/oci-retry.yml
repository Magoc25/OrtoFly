name: OCI ARM grabber (temporário)

# Robô que tenta criar a VM gratuita A1.Flex (4 OCPU/24 GB) na Oracle até a
# capacidade ARM liberar. Roda 24/7 sem manter nada aberto. Quando a VM existir,
# os ciclos seguintes viram no-op (checagem de duplicidade) — sem custo.
# REMOVER este arquivo depois que a VM for criada.

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'   # a cada 15 min

permissions:
  contents: read

concurrency:
  group: oci-arm-grabber
  cancel-in-progress: false

jobs:
  try-launch:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar OCI CLI
        run: |
          pip install --quiet oci-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Tentar criar a VM A1.Flex 4/24
        env:
          OCI_CLI_USER: ${{ secrets.OCI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_CLI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY_B64: ${{ secrets.OCI_KEY_B64 }}
        run: |
          export OCI_CLI_KEY_CONTENT="$(printf '%s' "$OCI_KEY_B64" | base64 -d)"

          # Valores fixos (mesmos do script que funcionou no Cloud Shell)
          SUBNET="ocid1.subnet.oc1.sa-saopaulo-1.aaaaaaaadp4wuxbrxxmn3dlrbqqfwaioho7ootmfduvcwyrupvklkhzicw3q"
          AD="meIx:SA-SAOPAULO-1-AD-1"
          IMG="ocid1.image.oc1.sa-saopaulo-1.aaaaaaaawvmdar75jvnrck56qxxqli2oafzdqc2wxadcnnr7zzis6fafd3dq"

          echo 'ssh-rsa  marlongcos@422f340f79a1' > pubkey.pub
          echo '{"ocpus":4,"memoryInGBs":24}' > shape.json

          # Deriva o compartment direto do subnet (garante consistencia) e valida a auth
          C=$(oci network subnet get --subnet-id "$SUBNET" --query 'data."compartment-id"' --raw-output 2>/dev/null)
          if [ -z "$C" ]; then echo "Falha de auth ou subnet inacessivel — confira os secrets OCI_*."; exit 1; fi
          echo "Compartment: $C  /  AD: $AD"

          # Seguranca: nao criar se ja existe uma mgc-server RUNNING ou PROVISIONING
          R=$(oci compute instance list --compartment-id "$C" --display-name mgc-server --lifecycle-state RUNNING --query 'data[0].id' --raw-output 2>/dev/null)
          P=$(oci compute instance list --compartment-id "$C" --display-name mgc-server --lifecycle-state PROVISIONING --query 'data[0].id' --raw-output 2>/dev/null)
          if [ -n "$R" ] && [ "$R" != "null" ]; then echo "Ja existe mgc-server RUNNING ($R). Nada a fazer."; exit 0; fi
          if [ -n "$P" ] && [ "$P" != "null" ]; then echo "Ja existe mgc-server PROVISIONING. Nada a fazer."; exit 0; fi

          oci compute instance launch \
            --availability-domain "$AD" \
            --compartment-id "$C" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config file://shape.json \
            --image-id "$IMG" \
            --subnet-id "$SUBNET" \
            --assign-public-ip true \
            --boot-volume-size-in-gbs 100 \
            --display-name "mgc-server" \
            --ssh-authorized-keys-file pubkey.pub > out.txt 2>&1

          if grep -q 'ocid1.instance' out.txt; then
            echo "=============================="
            echo "VM CRIADA COM SUCESSO!"
            grep -o 'ocid1.instance[^"]*' out.txt | head -1
            echo "=============================="
            exit 0
          elif grep -qiE "Out of host capacity|capacity|InternalError|TooManyRequests|429" out.txt; then
            echo "Sem capacidade ARM ainda — tentaremos no proximo ciclo."
            exit 0
          else
            echo "Erro diferente:"
            cat out.txt
            exit 1
          fi
