# Verificação automática a cada push que toque no app:
#   degrau 1 = check.js (sintaxe + handlers/ids órfãos, sem dependências)
#   degrau 2 = tests/smoke.js (boot + plano + exports num DOM simulado)
# O jsdom é instalado SÓ aqui no CI — o repositório não tem package.json de
# propósito (protocolo OneDrive: nada de node_modules na pasta local).
# FILTRO PELA NEGATIVA (guia r103d): workflow de verificação usa paths-ignore, nunca
# paths. Allowlist é a lista do que está protegido, e ela encolhe CALADA a cada arquivo
# novo que ninguém acrescentou — a falha dela é silêncio, não erro. A negativa nomeia só
# o ruído conhecido (o commit automático do stats.json, r31) e não tem como omitir o que
# nasceu depois. Foi assim que a apresentacao.html quase ficou sem gatilho (r100).
name: checks

on:
  push:
    branches: [main]
    paths-ignore:
      - 'stats.json'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Degrau 1 — estático (sintaxe + órfãos)
        run: node check.js
      - name: Degrau 2 — smoke jsdom (boot + plano + exports)
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund jsdom@24
          node tests/smoke.js
